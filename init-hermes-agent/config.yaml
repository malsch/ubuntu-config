model:
  default: claude-haiku-4.5
  provider: copilot
  base_url: https://api.githubcopilot.com
  api_mode: chat_completions
agent:
  max_turns: 90
  disabled_toolsets:
  - computer_use
  - discord
  - discord_admin
  - feishu_doc
  - feishu_drive
  - homeassistant
  - image_gen
  - project
  - spotify
  - tts
  - video
  - video_gen
  - vision
  - x_search
  - yuanbao
  verbose: false
  reasoning_effort: high
  personalities:
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: docker
  cwd: /workspace
  timeout: 180
  home_mode: auto
  docker_image: mise-dev:latest
  docker_forward_env:
  - TAVILY_API_KEY
  docker_env:
    PYTHONUNBUFFERED: '1'
  container_cpu: 1
  container_memory: 1500
  container_disk: 12000
  container_persistent: true
  docker_volumes:
  # - /home/aiagent/.hermes:/home/aiagent/.hermes
  - /home/aiagent/workspace:/workspace
  - /home/aiagent/.hermes/cache/documents:/output
  - /home/aiagent/.local/share/mise:/home/aiagent/.local/share/mise:ro
  - /home/aiagent/.config/mise:/home/aiagent/.config/mise:ro
  - /var/log:/var/log:ro
  - /var/log/journal:/var/log/journal:ro
  - /etc/machine-id:/etc/machine-id:ro
  docker_mount_cwd_to_workspace: false
  docker_run_as_host_user: true
  lifetime_seconds: 300
web:
  backend: tavily
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: openrouter
    model: stepfun/step-3.7-flash
  web_extract:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  compression:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  title_generation:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    timeout: 30
  tts_audio_tags:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  memory_notifications: verbose
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
  sections:
    thinking: expanded
tts:
  use_gateway: false
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
  disabled:
