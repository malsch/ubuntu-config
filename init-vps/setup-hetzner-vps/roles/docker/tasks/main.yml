---
# Docker Engine (official repo) + Compose plugin.
- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ docker_codename }} stable\n"
    mode: "0644"

- name: Download Docker packages only from Docker's repository
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/docker
    content: |
      Package: {{ docker_packages | join(' ') }}
      Pin: release o=Docker
      Pin-Priority: 500

      Package: {{ docker_packages | join(' ') }}
      Pin: release o=*
      Pin-Priority: -1
    mode: "0644"
  vars:
    docker_packages: [docker-ce, docker-ce-cli, docker-ce-rootless-extras, containerd.io, docker-buildx-plugin, docker-compose-plugin]

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: true

# Log rotation + keep containers running across daemon restarts.
- name: Configure Docker daemon
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# NOTE: the docker group is effectively root.
- name: Add admin to docker group
  ansible.builtin.user:
    name: "{{ admin_username }}"
    groups: docker
    append: true

# By default only Ubuntu's own archives are updated automatically.
- name: Also update Docker automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-docker
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "Docker:${distro_codename}";
      };
    mode: "0644"
