---
- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "yes"

# Packages used by exactly one role are installed by that role instead.
- name: Install base packages
  ansible.builtin.apt:
    name:
      # Downloads and third-party repos (Docker, NetBird)
      - ca-certificates # TLS certificates
      - curl            # HTTP client
      - gnupg           # key verification

      # Development
      - git             # version control
      - jq              # JSON processor
      - ripgrep         # fast search

      # Python build tools
      - build-essential # compilers
      - python3-dev     # Python headers
      - libffi-dev      # FFI headers

      # Media
      - ffmpeg          # audio/video

      # Monitoring
      - htop            # process viewer
      - mtr             # network diagnostics

      # File transfer
      - rsync           # file sync
      - syncthing       # folder sync
    state: present
